# DB CI — 두 잡이 서로 다른 걸 본다.
#   pgtap  : 스키마 스냅샷을 복원한 뒤 pgTAP 불변식 테스트를 돌린다(빠른 회귀).
#   replay : 빈 DB 에 baseline + 마이그레이션을 처음부터 다시 쌓아 스냅샷과 대조한다
#            (재현성 + 스냅샷/마이그레이션 드리프트 감지 — scripts/replay_check.sh).
#   deno   : Edge Function 타입 검사(래칫). 이 워크플로가 함수 배포의 게이트인데
#            (deploy-functions.yml 의 workflow_run) 정작 함수 코드를 아무도 안 보고
#            있었다 — 배포를 유발하는 변경과 게이트가 검증하는 대상이 서로소였다.
name: DB Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Edge Function 타입 검사 — **래칫**이다(0 이 아니라 "현재보다 늘지 않기").
  #
  # 왜 0 이 아닌가: 이 저장소는 deno check 를 한 번도 돌린 적이 없어서 기존 오류가
  # 18건 쌓여 있다. 전부 런타임에는 무해하지만(Deno 가 타입을 지우고 실행) 진짜
  # 타입 오류가 섞여 들어와도 구분할 방법이 없었다 — 그 구분을 만드는 게 목적이다.
  # 커버리지 래칫과 같은 방식으로 상한을 고정하고 줄여 간다(0031 §3.6).
  #
  # ⚠️ 숫자가 우리 코드와 무관하게 움직일 수 있다. import 가 `jsr:@supabase/supabase-js@2`
  # 처럼 범위 지정이고 lockfile 이 없어서, 의존성이 새 버전을 내면 오류 수가 바뀐다.
  # lockfile 을 두지 않은 이유는 **배포가 그걸 쓰지 않기 때문**이다 — CI 만 고정하면
  # 실제로 나가는 것과 다른 걸 검사하게 된다. Deno 버전은 고정해 드리프트 축을 하나
  # 줄였다. 늘어서 빨간불이 되면 새 오류가 우리 것인지 의존성 것인지 먼저 보고,
  # 의존성 쪽이면 상한을 그 값으로 올리며 이유를 커밋에 남길 것.
  denocheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # 고정한다 — 새 Deno 가 검사를 조이면 우리 코드와 무관하게 빨간불이 된다.
          deno-version: v2.9.4

      - name: 타입 검사 (래칫 ≤1)
        shell: bash
        run: |
          set -uo pipefail
          # 러너 기본 셸은 `-e` 다. 실패를 '받아서' 세는 게 이 스텝의 일이므로
          # 여기서만 끈다 — 안 끄면 deno check 가 실패하는 순간 스크립트가 죽어
          # 상한 비교에 도달하지도 못한다(집계가 아니라 무조건 빨간불이 된다).
          set +e
          MAX=1
          out=$(deno check supabase/functions/*/index.ts 2>&1)
          rc=$?
          # 색상 이스케이프를 걷어내고 `TS####  [ERROR]` 헤더 줄을 센다.
          #
          # ⚠️ 종전에는 'Found N errors' 를 파싱했는데 **deno 는 오류가 1건이면 그 줄을
          #    찍지 않는다.** 그래서 오류 1건이 n=0 으로 집계돼 조용히 통과했고, 심지어
          #    "0건으로 줄었으니 MAX 를 0 으로" 라는 안내까지 냈다 — 그 상태로 굳으면
          #    게이트가 1건짜리 오류에 영원히 눈을 감는다(0032 §7.8).
          clean=$(printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g')
          n=$(printf '%s\n' "$clean" | grep -cE 'TS[0-9]+ \[ERROR\]' || true)
          # 타입 오류가 아닌 실패(임포트 해석 실패 등)를 통과시키지 않는다.
          if [ "$rc" -ne 0 ] && [ "$n" -eq 0 ]; then
            printf '%s\n' "$clean"
            echo "::error::deno check 가 실패했는데(rc=$rc) 타입 오류를 세지 못했습니다 — 위 출력을 확인하세요."
            exit 1
          fi
          echo "deno check 오류 $n건 (상한 $MAX)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt "$MAX" ]; then
            printf '%s\n' "$clean"
            echo "::error::타입 오류가 $n건으로 상한 $MAX 을 넘었습니다."
            echo "새로 생긴 오류가 이 PR 것인지 의존성 업데이트 탓인지 먼저 확인하세요."
            exit 1
          fi
          if [ "$n" -lt "$MAX" ]; then
            echo "::notice::오류가 $n건으로 줄었습니다 — db-tests.yml 의 MAX 를 $n 으로 내려주세요(래칫)."
          fi

      - name: 엣지 함수 단위 테스트
        shell: bash
        run: deno test supabase/functions/_shared/*_test.ts

  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        # 운영 DB 와 동일 메이저(Postgres 17) 이미지 — pgtap/postgis/pg_net 동봉.
        image: supabase/postgres:17.6.1.121
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_URL: postgresql://postgres:postgres@localhost:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - name: psql 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 스키마 스냅샷 복원 (prelude → schema)
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema/prelude.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema/schema.sql

      - name: pgTAP 테스트
        run: ./scripts/run_db_tests.sh "$DB_URL"

  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # replay_check.sh 는 이 서버에 작업용 DB(pmdb_replay)를 새로 만들어 거기서 돈다.
      DB_URL: postgresql://postgres:postgres@localhost:54323/postgres
      REPLAY_URL: postgresql://postgres:postgres@localhost:54323/pmdb_replay
      REPLAY_DB: pmdb_replay
    steps:
      - uses: actions/checkout@v4

      # services: 대신 직접 띄운다 — pg_cron 을 작업용 DB 에 설치하려면
      # cron.database_name 을 넘겨야 하는데(기본값은 postgres), 서비스 컨테이너로는
      # postgres 실행 인자를 줄 수 없다.
      #
      # 이미지 기본 DB 를 쓰지 않는 이유: postgres 롤이 수퍼유저가 아니고
      # storage 스키마는 supabase_admin 소유라 그 안에 스텁을 만들 수 없다
      # (storage 에는 테이블이 하나도 없어서 그대로 쓸 수도 없다).
      # 새 DB 에서는 우리가 소유자라 둘 다 해결된다.
      # pg_dump 는 서버와 같은 메이저(17)여야 한다. 우분투 기본 패키지는 16 이라
      # 덤프 형식이 달라져 없는 차이가 생긴다 — PGDG 저장소에서 17 을 받는다.
      - name: postgresql-client 17 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # 러너에 16 이 먼저 깔려 있어 PATH 앞자리를 차지한다 — 17 을 앞에 세운다.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Postgres 기동 (cron.database_name = 작업용 DB)
        run: |
          wait_ready() {
            # 컨테이너 안에서 재는 건 소용없다 — 엔트리포인트가 초기화용 임시 서버를
            # 먼저 띄우고 죽이므로 그때 준비된 것처럼 보인다. 호스트에서 실제 포트로 잰다.
            for _ in $(seq 1 60); do
              pg_isready -h localhost -p 54323 -U postgres -q && return 0
              sleep 2
            done
            docker logs --tail 50 pmdb-replay
            return 1
          }

          docker run -d --name pmdb-replay \
            -e POSTGRES_PASSWORD=postgres -p 54323:5432 \
            supabase/postgres:17.6.1.121
          wait_ready

          # pg_cron 은 cron.database_name 이 가리키는 DB 에서만 create extension 이 된다.
          # 기본값은 postgres 라 작업용 DB 로 바꿔야 하는데,
          #   · 실행 인자로 넘기면(postgres -c …) 이미지 기본 커맨드를 덮어써 설정 경로가
          #     날아간다(pg_stat_statements must be loaded via shared_preload_libraries)
          #   · ALTER SYSTEM 은 수퍼유저 전용인데 postgres 롤은 수퍼유저가 아니다
          # 그래서 설정 파일에 직접 덧붙이고 재기동한다.
          CONF=$(psql "$DB_URL" -tAc 'show config_file')
          docker exec -u root pmdb-replay \
            bash -c "printf \"\ncron.database_name = '%s'\n\" '$REPLAY_DB' >> '$CONF'"
          docker restart pmdb-replay
          wait_ready
          psql "$DB_URL" -tAc 'show cron.database_name'

      - name: 베이스라인이 스냅샷과 동기 상태인지 확인
        run: |
          ./scripts/build_baseline.py
          if ! git diff --quiet -- supabase/schema/baseline.sql; then
            echo "::error::baseline.sql 이 schema.sql 과 어긋났다. ./scripts/build_baseline.py 로 재생성해 커밋할 것."
            git diff --stat -- supabase/schema/baseline.sql
            exit 1
          fi

      - name: 리플레이 + 스냅샷 대조
        run: ./scripts/replay_check.sh "$DB_URL"

      # 실패했을 때 전체 diff 를 받아 볼 수 있게(콘솔에는 앞부분만 찍는다).
      - name: 스키마 diff 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-diff
          path: replay-diff.txt
          if-no-files-found: ignore

      # 재생된 스키마가 형태만 맞고 의미가 틀린 경우를 막기 위해, 스냅샷 경로와
      # 같은 불변식 테스트를 리플레이 결과 DB 에도 한 번 더 돌린다.
      - name: 재생된 DB 에서 pgTAP 테스트
        run: ./scripts/run_db_tests.sh "$REPLAY_URL"
