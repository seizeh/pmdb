# Edge Function 배포 — main 에 함수 코드가 바뀌어 들어오면 배포한다.
#
# 왜 필요한가: 배포는 손으로 `supabase functions deploy` 를 돌려 왔고, 그 결과
# **프로덕션에서 도는 코드가 main 에 없는 상태**가 실제로 생겼다(#134·#132 가 배포된 채
# 며칠 열려 있었다). 그 상태에서 누군가 main 을 체크아웃해 배포하면 배포본이 조용히
# 되감긴다 — 실패도 경고도 없이 게이트가 사라진다.
#
# DB 쪽은 db-tests.yml 의 replay 잡이 "마이그레이션과 실제 스키마가 어긋나면 실패"를
# 보장하지만, 함수 쪽에는 그런 장치가 없었다. 이 워크플로가 그 자리를 메운다 —
# main 이 곧 배포본이 되게 만든다.
#
# config.toml 이 함수별 verify_jwt 를 고정하므로 CLI 가 그 값을 그대로 적용한다.
#
# ── 왜 push 가 아니라 workflow_run 인가 ─────────────────────────────────────
#
# 종전에는 `on: push: branches:[main]` 이라 **db-tests.yml 과 병렬로** 돌았다.
# 룰셋이 PR 머지 시점에 테스트를 요구하긴 하지만 그건 머지 전 커밋 기준이고,
# `strict_required_status_checks_policy` 가 꺼져 있어 브랜치 최신화도 요구하지
# 않는다. 각자는 통과했는데 합쳐 놓으니 깨지는 조합이 그대로 배포된다는 뜻이다.
#
# 게다가 배포가 테스트보다 먼저 끝난다(실측: db-tests 수 분 vs 배포 ~1분).
# 빨간불이 켜질 무렵엔 이미 프로덕션에 올라가 있고, Edge Function 은 자동 롤백도
# 없다. 이 워크플로가 막으려던 게 "main ≠ 배포본" 인데, 정작 **테스트가 거부한
# 코드가 배포본이 되는** 구멍은 열려 있었다.
#
# 그래서 DB Tests 가 성공했을 때만 이어서 돈다. 대가로 잃는 것 두 가지:
#   · `paths:` 필터를 못 쓴다(workflow_run 에는 없다) → 아래에서 직접 본다.
#   · 트리거가 한 단계 늘어 배포가 db-tests 만큼 늦어진다(수 분).
name: 함수 배포

on:
  workflow_run:
    workflows: ["DB Tests"] # db-tests.yml 의 name 과 정확히 일치해야 한다
    types: [completed]
  workflow_dispatch: # 코드 변경 없이 강제 재배포(드리프트 복구용)

# 연속 푸시 시 마지막 것만 배포 — 앞선 배포가 뒤엣것을 덮어쓰지 않게.
concurrency:
  group: deploy-functions
  cancel-in-progress: true

jobs:
  # 배포할 이유가 있는지만 판정한다. 실패한/PR 발 DB Tests 는 여기서 걸러지고,
  # 함수와 무관한 변경(문서·마이그레이션)도 여기서 걸러진다.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # workflow_run 은 성공·실패·취소 모두 발화한다. main 에 대한 push 가
    # **성공**했을 때만 통과시킨다(PR 의 DB Tests 로는 배포하지 않는다).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 테스트를 통과한 **바로 그 커밋**을 본다. 기본값(main 최신)으로 두면
          # 그 사이 들어온 미검증 커밋을 배포하게 된다.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2 # HEAD^ 와 비교해야 변경 파일을 알 수 있다

      # 종전 `paths:` 필터의 대체물. workflow_run 에는 paths 가 없다.
      #
      # ⚠ 판정이 애매하면 **배포하는 쪽**으로 넘어간다(fail-open). 불필요한 배포는
      #   1분을 버리는 게 전부지만, 필요한 배포를 건너뛰면 main ≠ 배포본이 되고
      #   그건 이 워크플로가 존재하는 이유 그 자체다.
      - name: 함수 관련 변경인지
        id: check
        shell: bash
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "수동 실행 — 변경 여부와 무관하게 전량 배포합니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git rev-parse --verify -q HEAD^ >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"   # 부모가 없다 → 판정 불가
            exit 0
          fi
          files=$(git diff --name-only HEAD^ HEAD || true)
          if [ -z "$files" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"   # diff 실패/빈 결과 → 판정 불가
            exit 0
          fi
          if echo "$files" | grep -qE '^(supabase/functions/|supabase/config\.toml$|\.github/workflows/deploy-functions\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "함수 관련 변경이 없어 배포를 건너뜁니다($sha)." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # 시크릿이 없으면 CLI 가 알 수 없는 오류로 죽는다 — 먼저 명확히 알린다.
      - name: 시크릿 확인
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::저장소 시크릿이 없습니다: SUPABASE_ACCESS_TOKEN"
            echo "https://supabase.com/dashboard/account/tokens 에서 발급 후"
            echo "Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi

      # verify_jwt 드리프트 방지의 전제 조건 — config.toml 에 항목이 없는 함수는
      # 배포 시 기본값(verify_jwt=true)으로 리셋된다. send-push 처럼 pg_net 이
      # apikey 없이 호출하는 함수가 여기 빠지면 게이트웨이에서 막혀 조용히 깨진다.
      - name: 모든 함수가 config.toml 에 있는지
        shell: bash
        run: |
          missing=""
          for d in supabase/functions/*/; do
            name=$(basename "$d")
            case "$name" in _*|supabase) continue ;; esac
            grep -q "^\[functions\.${name}\]" supabase/config.toml || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::config.toml 에 항목이 없는 함수:$missing"
            echo "항목이 없으면 배포 시 verify_jwt 가 true 로 리셋됩니다(README §config.toml 참고)."
            exit 1
          fi
          echo "함수 $(ls -d supabase/functions/*/ | grep -vcE '/(_|supabase/)')개 — 전부 config.toml 에 있음"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 함수 이름을 지정하지 않으면 전부 배포한다. 바뀐 것만 고르지 않는 게 요점이다 —
      # 매번 전량 배포해야 "main = 배포본" 이 성립하고, 손으로 올린 배포본이 있어도 수렴한다.
      - name: 전체 배포
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          ref=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          [ -n "$ref" ] || { echo "::error::config.toml 에서 project_id 를 못 읽었습니다"; exit 1; }
          echo "프로젝트: $ref"
          supabase functions deploy --project-ref "$ref"
          echo "배포 완료 — 프로젝트 $ref" >> "$GITHUB_STEP_SUMMARY"
